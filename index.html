<script>

const KEY = 'mr_tesouraria_v1';

function save() { localStorage.setItem(KEY, JSON.stringify(S)); if (ONLINE && authUser) agendarPush(); }
// ============================================================ NUVEM (Supabase): login por e-mail, estado compartilhado, senha de aprovação verificada no servidor, anexos no Storage
const CFG = window.MR_CONFIG || {}; const ONLINE = !!(CFG.url && /^https:\/\//.test(CFG.url) && CFG.anonKey && !/COLE_AQUI/.test(CFG.anonKey) && window.supabase);
let sb = ONLINE ? window.supabase.createClient(CFG.url, CFG.anonKey) : null, authUser = null, versaoRemota = 0, salvando = false, pushPendente = false, pushTimer = null, temPinCache = null;
function setSync(st, msg) { const el = document.getElementById('sync'); if (!el) return; el.textContent = st === 'salvando' ? '● salvando…' : st === 'ok' ? '● sincronizado' : st === 'erro' ? '● erro ao salvar' : ''; el.style.color = st === 'erro' ? 'var(--bad)' : st === 'salvando' ? 'var(--warn)' : 'var(--ok)'; el.title = msg || (st === 'ok' ? 'Dados salvos na nuvem · versão ' + versaoRemota : ''); if (st === 'erro' && msg) toast('Não consegui salvar na nuvem: ' + msg); }
function agendarPush() { clearTimeout(pushTimer); pushTimer = setTimeout(pushEstado, 400); }
async function pushEstado() {
  if (!ONLINE || !authUser) return; if (salvando) { pushPendente = true; return; } salvando = true; setSync('salvando');
  try { const { data, error } = await sb.from('estado').update({ dados: S, versao: versaoRemota + 1, atualizado_em: new Date().toISOString(), atualizado_por: authUser.id }).eq('id', 1).eq('versao', versaoRemota).select('versao'); if (error) throw error;
    if (!data || !data.length) { salvando = false; await recarregarRemoto(true); return; } versaoRemota = data[0].versao; setSync('ok'); }
  catch (e) { setSync('erro', e.message || String(e)); }
  salvando = false; if (pushPendente) { pushPendente = false; pushEstado(); }
}
async function recarregarRemoto(conflito) {
  const { data, error } = await sb.from('estado').select('dados,versao').eq('id', 1).single(); if (error) return setSync('erro', error.message);
  if (data && data.dados) { const sess = S.sessao; S = data.dados; S.sessao = sess; ensurePlano(); localStorage.setItem(KEY, JSON.stringify(S)); versaoRemota = data.versao; render(); if (conflito) toast('Outra pessoa salvou antes de você — dados recarregados. Confira e refaça sua última ação, se preciso.'); }
  setSync('ok');
}
function assinarRealtime() { try { sb.channel('sinal-estado').on('postgres_changes', { event: '*', schema: 'public', table: 'sinal' }, (p) => { const v = p.new && p.new.versao; if (v && v > versaoRemota && !salvando) recarregarRemoto(false); }).subscribe(); } catch (e) { console.warn('realtime', e); } }
async function iniciarOnline() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) return mostrarLoginOnline(); await aoLogar(session.user);
}
async function aoLogar(user) {
  authUser = user; setSync('salvando');
  const { data, error } = await sb.from('estado').select('dados,versao').eq('id', 1).maybeSingle();
  if (error) { authUser = null; return mostrarLoginOnline('Erro ao ler o banco: ' + error.message + '. O script SQL foi executado no Supabase?'); }
  if (!data) { const { error: e2 } = await sb.from('estado').insert({ id: 1, dados: S, versao: 1 }); if (e2) { authUser = null; return mostrarLoginOnline('Erro ao criar o estado: ' + e2.message); } versaoRemota = 1; }
  else if (!data.dados) { const { data: d3, error: e3 } = await sb.from('estado').update({ dados: S, versao: data.versao + 1, atualizado_por: user.id }).eq('id', 1).select('versao'); if (e3) { authUser = null; return mostrarLoginOnline('Erro ao enviar os dados iniciais: ' + e3.message); } versaoRemota = d3[0].versao; toast('Dados deste computador enviados para a nuvem.'); }
  else { S = data.dados; versaoRemota = data.versao; }
  ensurePlano();
  const email = (user.email || '').toLowerCase(); let u = S.usuarios.find(x => (x.email || '').toLowerCase() === email) || S.usuarios.find(x => x.authId === user.id);
  if (!u) { if (!S.usuarios.some(x => x.email || x.authId)) { u = S.usuarios.find(x => papelU(x) === 'tesoureiro') || S.usuarios[0]; u.email = user.email; toast('Primeiro acesso online: sua conta foi vinculada ao usuário ' + u.nome + '.'); } else { authUser = null; await sb.auth.signOut(); return mostrarLoginOnline('Sua conta (' + email + ') não está vinculada a nenhum usuário. Peça ao Tesoureiro ou Presidente para cadastrar seu e-mail em Cadastros → Usuários.'); } }
  if (!u.ativo) { authUser = null; await sb.auth.signOut(); return mostrarLoginOnline('Usuário inativo — fale com o Tesoureiro ou Presidente.'); }
  u.authId = user.id; u.ultimoAcesso = agora(); S.sessao = u.id; localStorage.setItem(KEY, JSON.stringify(S));
  const w = document.getElementById('loginWrap'); if (w) w.remove(); document.querySelector('.app').style.visibility = ''; view = 'painel'; render(); setSync('ok'); agendarPush(); assinarRealtime();
  temPinCache = null; verificarTemPin().then(t => { if (!t) popupDefinirPin(true); });
}
function mostrarLoginOnline(msg) {
  document.querySelector('.app').style.visibility = 'hidden'; let w = document.getElementById('loginWrap'); if (!w) { w = document.createElement('div'); w.id = 'loginWrap'; w.className = 'loginwrap'; document.body.appendChild(w); }
  w.innerHTML = `<div class="loginbox"><div class="brand"><div class="mark" style="background:var(--acc);color:#fff">M</div><div><b>${esc(S.config.nome || 'Missão Revolução')}</b><small>Governança financeira · online</small></div></div><h1>Entrar</h1><p class="sm mut" style="margin:0 0 14px">Use o e-mail cadastrado pelo Tesoureiro e sua senha.</p>
    <label>E-mail</label><input id="lgUser" type="email" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lgPass').focus()">
    <label style="margin-top:10px">Senha de acesso</label><input id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrarOnline()">
    <div id="lgMsg">${msg ? `<div class="al b" style="margin-top:10px">${esc(msg)}</div>` : ''}</div>
    <button class="p" style="width:100%;margin-top:16px" onclick="entrarOnline()">Entrar</button>
    <div class="flex" style="margin-top:10px;justify-content:space-between"><button class="link" onclick="criarContaOnline()">Primeiro acesso: criar minha senha</button><button class="link" onclick="esqueciSenha()">Esqueci a senha</button></div></div>`;

const lgMsg = (t, ok) => { const el = document.getElementById('lgMsg'); if (el) el.innerHTML = `<div class="al ${ok ? 'ok' : 'b'}" style="margin-top:10px">${esc(t)}</div>`; };
async function entrarOnline() { const email = document.getElementById('lgUser').value.trim(), password = document.getElementById('lgPass').value; if (!email || !password) return lgMsg('Informe e-mail e senha.'); const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) return lgMsg(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : /confirm/i.test(error.message) ? 'Confirme seu e-mail (veja a caixa de entrada) antes de entrar.' : error.message); await aoLogar(data.user); }
async function criarContaOnline() { const email = document.getElementById('lgUser').value.trim(), password = document.getElementById('lgPass').value; if (!email) return lgMsg('Digite seu e-mail (o mesmo cadastrado em Usuários) e a senha que quer usar, depois clique de novo.'); if (password.length < 6) return lgMsg('Digite no campo de senha a senha que quer criar (mínimo 6).'); const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) return lgMsg(error.message); if (data.session) return aoLogar(data.user); lgMsg('Conta criada. Enviamos um e-mail de confirmação para ' + email + ' — clique no link e depois entre com a senha.', true); }
async function esqueciSenha() { const email = document.getElementById('lgUser').value.trim(); if (!email) return lgMsg('Digite seu e-mail e clique de novo em "Esqueci a senha".'); const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) return lgMsg(error.message); lgMsg('Enviamos um link para redefinir a senha para ' + email + '.', true); }
function popupNovaSenhaAcesso() { const w = document.getElementById('loginWrap'); if (w) w.remove(); document.querySelector('.app').style.visibility = ''; popup(`<h2>Nova senha de acesso</h2><label>Nova senha (mín. 6)</label><input id="nsS1" type="password"><label style="margin-top:8px">Repita</label><input id="nsS2" type="password"><div class="flex" style="margin-top:14px"><button class="p" onclick="salvarNovaSenhaAcesso()">Salvar</button></div>`); }
async function salvarNovaSenhaAcesso() { const s1 = document.getElementById('nsS1').value, s2 = document.getElementById('nsS2').value; if (s1.length < 6) return toast('Mínimo 6 caracteres.'); if (s1 !== s2) return toast('As senhas não conferem.'); const { error } = await sb.auth.updateUser({ password: s1 }); if (error) return toast(error.message); popupHtml = null; toast('Senha de acesso atualizada.'); const { data: { session } } = await sb.auth.getSession(); if (session) aoLogar(session.user); }
async function sairOnline() { await sb.auth.signOut(); authUser = null; popupHtml = null; detalheId = null; mostrarLoginOnline(); }

async function verificarTemPin() { if (temPinCache != null) return temPinCache; const { data, error } = await sb.rpc('tem_pin'); temPinCache = !error && !!data; return temPinCache; }
function popupDefinirPin(primeira) { popup(`<h2>${primeira ? 'Crie sua senha de aprovação' : 'Trocar senha de aprovação'}</h2><p class="sm mut">${primeira ? 'Ela é pedida toda vez que você assina, aprova, paga, confere ou estorna — é a sua assinatura eletrônica. Diferente da senha de acesso. Mínimo 4 caracteres.' : 'Informe a atual e a nova (mínimo 4).'}</p>${primeira ? '' : '<label>Senha de aprovação atual</label><input id="dpAtual" type="password">'}<label style="margin-top:8px">Nova senha de aprovação</label><input id="dpP1" type="password"><label style="margin-top:8px">Repita</label><input id="dpP2" type="password"><div class="flex" style="margin-top:14px"><button class="p" onclick="salvarPinOnline(${!!primeira})">Salvar</button>${primeira ? '' : '<button class="s" onclick="fecharPopup()">Cancelar</button>'}</div>`); }
async function salvarPinOnline(primeira) { const p1 = document.getElementById('dpP1').value, p2 = document.getElementById('dpP2').value, at = primeira ? '' : document.getElementById('dpAtual').value; if (p1.length < 4) return toast('Mínimo 4 caracteres.'); if (p1 !== p2) return toast('As senhas não conferem.'); const { data, error } = await sb.rpc('definir_pin', { p_atual: at, p_novo: p1 }); if (error) return toast(error.message); if (!data) return toast('Senha de aprovação atual incorreta.'); temPinCache = true; popupHtml = null; render(); toast('Senha de aprovação salva.'); }
function popupMinhaSenhaOnline() { const u = me(); popup(`<h2>Minha conta</h2><div class="sm mut" style="margin-bottom:12px">${esc(u.nome)} · ${esc(authUser.email)}</div><div class="grid g2"><div><label>Nova senha de acesso (mín. 6)</label><input id="msS1" type="password" autocomplete="new-password"></div><div><label>Repita</label><input id="msS2" type="password" autocomplete="new-password"></div></div><div class="flex" style="margin-top:12px"><button class="p" onclick="trocarSenhaAcessoOnline()">Salvar senha de acesso</button><button class="s" onclick="popupDefinirPin(false)">Trocar senha de aprovação</button><button class="s" onclick="fecharPopup()">Fechar</button></div>`); }
async function trocarSenhaAcessoOnline() { const s1 = document.getElementById('msS1').value, s2 = document.getElementById('msS2').value; if (s1.length < 6) return toast('Mínimo 6.'); if (s1 !== s2) return toast('Não conferem.'); const { error } = await sb.auth.updateUser({ password: s1 }); if (error) return toast(error.message); popupHtml = null; render(); toast('Senha de acesso atualizada.'); }
async function apagarPinDe(usuarioId) { const u = userById(usuarioId); if (!u || !u.authId) return toast('Este usuário ainda não entrou online.'); if (!confirm(`Apagar a senha de aprovação de ${u.nome}? Ele cria uma nova no próximo acesso.`)) return; const { data, error } = await sb.rpc('apagar_pin', { alvo: u.authId }); if (error || !data) return toast('Não foi possível apagar (só Tesoureiro/Presidente).'); toast('Senha de aprovação apagada.'); }
// anexos no Storage
async function enviarAnexo(dataUrl, tipo, nome) { const res = await fetch(dataUrl); const blob = await res.blob(); const path = `${new Date().getFullYear()}/${uid()}${uid()}.${tipo === 'pdf' ? 'pdf' : 'jpg'}`; const { error } = await sb.storage.from('anexos').upload(path, blob, { contentType: tipo === 'pdf' ? 'application/pdf' : 'image/jpeg', upsert: false }); if (error) throw error; return path; }
async function urlAnexo(a) { if (!a) return null; if (a.dataUrl) return a.dataUrl; if (a.path && ONLINE) { const { data, error } = await sb.storage.from('anexos').createSignedUrl(a.path, 900); if (error) throw error; return data.signedUrl; } return null; }
// ============================================================ AUTENTICAÇÃO (local): login + senha de acesso + senha de aprovação

function decidirAprov(...args) { comPin('Assinar decisão sobre a despesa', () => _decidirAprov(...args)); }

  const c = document.getElementById('coment').value.trim(); if (dec === 'rejeitar' && !c) return toast('Justifique a recusa.');
  aprovar(d, me(), dec, c, ata);
  if (d.status === 'guia') { toast('Aprovação concluída — autorização de pagamento emitida'); abrirGuia(d.id); return; }
  if (d.status === 'paga' && d.rota.ratificacao) { toast('Ratificação concluída'); render(); return; }
  toast(dec === 'aprovar' ? (d.status === 'assinatura' ? 'Aprovada — enviada para assinatura' : 'Aprovação registrada') : (d.status === 'nao_ratificada' ? 'Ratificação negada — restituição devida' : 'Recusa registrada')); render();
}

}

  [d.lancamentoId, d.lancProvisao].forEach(id_ => { if (!id_) return; const l = S.lancamentos.find(x => x.id === id_); if (l && !l.estornadoPor) estornar(l, `despesa #${d.num} apagada — ${m}`); });

}

function cancelar(id) { const d = S.despesas.find(x => x.id === id); const m = prompt('Motivo do cancelamento:'); if (!m) return; if (d.lancProvisao) { const l = S.lancamentos.find(x => x.id === d.lancProvisao); if (l && !l.estornadoPor) estornar(l, `despesa #${d.num} cancelada — ${m}`); } d.status = 'cancelada'; d.historico.push({ data: agora(), quem: me().id, o: 'Cancelada: ' + m }); save(); render(); }

let recFormAberto = false, rcF = { de: '', ate: '', q: '', cat: '', classe: '', projeto: '', sit: '' };

function encerrarExercicio(...args) { comPin('Encerrar o exercício', () => _encerrarExercicio(...args)); }
function _encerrarExercicio(ano) {
  if (!['tesoureiro', 'presidente'].includes(papelU(me()))) return toast('Só Tesoureiro ou Presidente.');
  if ((S.exercicios || []).some(e => e.ano === ano)) return toast('Exercício já encerrado.');
  const pv = previaEncerramento(ano); if (!pv.partidas.length) return toast('Nada a encerrar.');

  if (!confirm(`Encerrar o exercício ${ano}?\n${pv.res >= 0 ? 'Superávit' : 'Déficit'} de ${fmt(pv.res)} será transferido para ${cplLabel(contaResultadoAcumulado().id)} e o período até 31/12/${ano} ficará travado.`)) return;
  const ca = contaResultadoAcumulado(); const partidas = pv.partidas.slice(); if (pv.res > 0) partidas.push({ contaId: ca.id, c: pv.res, d: 0 }); if (pv.res < 0) partidas.push({ contaId: ca.id, d: -pv.res, c: 0 });

    S.exercicios.push({ ano, de: pv.de, ate: pv.ate, lancamentoId: l.id, num: l.num, R: pv.R, D: pv.D, res: pv.res, ata, quem: me().id, em: agora() });

  } catch (e) { toast(e.message); }
}

  const rows = S.despesas.map(d => [d.num, d.competencia, d.vencimento || '', d.descricao, d.fornecedor, d.natureza, cplLabel(d.contaPlanoId), d.forma, contaLabel(contaById(d.contaId)), String(d.valor).replace('.', ','), ESTACOES[d.status], nomeU(d.solicitanteId), d.aprovacoes.filter(a => a.decisao === 'aprovar').map(a => nomeU(a.usuarioId) + ' ' + dt(a.data)).join('; '), assinaturasDe(d).map(s => nomeU(s.usuarioId) + ' ' + dt(s.data)).join('; '), d.pagamento ? d.pagamento.data : '', d.pagamento ? d.pagamento.comprovante : '']);
  const csv = [cols, ...rows].map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `despesas-${hoje()}.csv`; a.click();
}
